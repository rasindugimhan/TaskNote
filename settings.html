<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Settings</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body { padding: 20px; display: block; overflow-y: auto; }
    h2 { margin-bottom: 20px; font-weight: 500; }
  </style>
</head>
<body>
  <h2>Application Settings</h2>
  
  <div class="setting-row">
    <span>Theme</span>
    <select id="setting-theme">
      <option value="system">System</option>
      <option value="light">Light</option>
      <option value="dark">Dark</option>
    </select>
  </div>
  
  <div class="setting-row">
    <span>Auto Start on PC Boot</span>
    <input type="checkbox" id="setting-autolaunch">
  </div>
  
  <div style="font-size: 12px; color: #888; margin-top: 20px;">
    Settings are applied automatically.
  </div>

  <script src="settings.js"></script>
</body>
</html>
